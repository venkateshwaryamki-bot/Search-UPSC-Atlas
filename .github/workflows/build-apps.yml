# Builds the Android and iOS apps on every push to main, to check that both compile.
# The Android job also produces a debug APK you can install on a phone for testing.
# Signed store builds are made by Codemagic (see codemagic.yaml and PUBLISHING.md).
name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the test APK as a GitHub Release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the web app and copy it into Android
        run: |
          npm ci
          node build.mjs
          npx cap sync android
      - name: Build debug APK and unsigned app bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Publish the test APK as a GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SearchUPSCAtlas-test.apk
          cp android/app/build/outputs/bundle/release/app-release.aab SearchUPSCAtlas-unsigned.aab
          NOTES="Test build ${GITHUB_RUN_NUMBER} from commit ${GITHUB_SHA::7}. The .aab is unsigned and must be signed with the upload key before it goes to Google Play. Install it directly on an Android phone (allow installs from unknown sources). This is not the signed Play Store version."
          gh release delete test-build --yes --cleanup-tag 2>/dev/null || true
          gh release create test-build SearchUPSCAtlas-test.apk SearchUPSCAtlas-unsigned.aab --title "Test build (Android APK)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"

  # iOS is paused for now (Android first). Run it from the Actions tab with "Run workflow" when needed.
  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the web app and copy it into iOS
        run: |
          npm ci
          node build.mjs
          npx cap sync ios
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build for the iOS simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -40
          test "${PIPESTATUS[0]}" -eq 0
